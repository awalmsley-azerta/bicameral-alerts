name: Deploy

# Push to main: tests, then build the service image and register a task definition
# revision pinned to its digest. Nothing runs on its own yet (step 1 of the shared
# alerts service): the backtest is started by hand and only reads.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accion:
        description: "desplegar: build and register | backtest: replay a past window and compare with what the producers wrote"
        type: choice
        options: [desplegar, backtest]
        default: desplegar
      desde:
        description: "backtest: start, ISO date or time (UTC), e.g. 2026-10-20"
        required: false
      hasta:
        description: "backtest: end (optional, default now)"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-bicameral-alertas
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPO: bicameral-prod-alertas
  TASK_FAMILY: bicameral-prod-alertas
  CONTAINER: alertas
  ECS_CLUSTER: bicameral-prod-cluster
  LOG_GROUP: /ecs/bicameral-prod-alertas
  RED_PARAM: /bicameral/prod/alertas/red

jobs:
  tests:
    if: github.event_name == 'push' || inputs.accion == 'desplegar'
    uses: ./.github/workflows/ci.yml

  # Until bicameral-infra creates the repo, task definition and network parameter,
  # the AWS jobs stay off; set ALERTAS_DEPLOY_ENABLED=true after the apply.
  desactivado:
    if: vars.ALERTAS_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - run: echo "::notice::Deploy disabled. Set the repository variable ALERTAS_DEPLOY_ENABLED=true once the infra is applied."

  deploy:
    needs: tests
    if: vars.ALERTAS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ECR registry URL
        id: ecr
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "url=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        run: aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${{ steps.ecr.outputs.url }}"

      - name: Set up Docker Buildx
        run: docker buildx create --use || true

      - name: Build and push image
        run: |
          SHA=$(git rev-parse --short HEAD)
          CACHE_TAG="${{ steps.ecr.outputs.url }}/${ECR_REPO}:cache"
          docker buildx build --platform linux/arm64 \
            --cache-from type=registry,ref="${CACHE_TAG}" \
            --cache-to type=registry,ref="${CACHE_TAG},mode=max" \
            -t "${{ steps.ecr.outputs.url }}/${ECR_REPO}:prod" \
            -t "${{ steps.ecr.outputs.url }}/${ECR_REPO}:${SHA}" \
            --push .

      - name: Register task definition revision pinned to the image digest
        run: |
          set -euo pipefail
          REPO_URL="${{ steps.ecr.outputs.url }}/${ECR_REPO}"
          DIGEST=$(aws ecr describe-images --repository-name "${ECR_REPO}" --image-ids imageTag=prod --query 'imageDetails[0].imageDigest' --output text)
          aws ecs describe-task-definition --task-definition "${TASK_FAMILY}" --query 'taskDefinition' > td.json
          jq 'del(.status,.taskDefinitionArn,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy,.revision,.deregisteredAt)
              | .containerDefinitions |= map(.image = "'"${REPO_URL}@${DIGEST}"'")' td.json > td-new.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          {
            echo "### Deploy"
            echo "- image: \`${REPO_URL}@${DIGEST}\`"
            echo "- registered: \`${ARN}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backtest:
    if: vars.ALERTAS_DEPLOY_ENABLED == 'true' && inputs.accion == 'backtest'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Read only on the database (the connections are READ ONLY). The report goes
      # to the job summary; the full JSON is the BACKTEST_JSON log line.
      - name: Run the backtest
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: |
          set -euo pipefail
          if [ -z "${DESDE}" ]; then echo "::error::desde is required for a backtest"; exit 1; fi
          ORDEN=$(jq -cn --arg d "$DESDE" --arg h "$HASTA" '["backtest","--desde",$d] + (if $h == "" then [] else ["--hasta",$h] end)')
          RED=$(aws ssm get-parameter --name "${RED_PARAM}" --query 'Parameter.Value' --output text)
          TAREA=$(aws ecs run-task --cluster "${ECS_CLUSTER}" --launch-type FARGATE --task-definition "${TASK_FAMILY}" \
                    --network-configuration "${RED}" --started-by github-backtest \
                    --overrides '{"containerOverrides":[{"name":"'"${CONTAINER}"'","command":'"${ORDEN}"'}]}' \
                    --query 'tasks[0].taskArn' --output text)
          echo "task: ${TAREA}"
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TAREA}"
          SALIDA=$(aws ecs describe-tasks --cluster "${ECS_CLUSTER}" --tasks "${TAREA}" \
                     --query 'tasks[0].containers[0].exitCode' --output text)
          aws logs get-log-events --log-group-name "${LOG_GROUP}" \
            --log-stream-name "ecs/${CONTAINER}/${TAREA##*/}" --query 'events[].message' --output text \
            | tr '\t' '\n' > salida.txt || true
          grep -v '^BACKTEST_JSON ' salida.txt || true
          {
            echo "### Backtest ${DESDE} → ${HASTA:-now} (exit ${SALIDA})"
            echo '```'
            grep -A20 '^BACKTEST ' salida.txt | grep -v '^BACKTEST_JSON ' || echo "(no summary; see the task log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^BACKTEST_JSON ' salida.txt | sed 's/^BACKTEST_JSON //' > backtest.json || true
          [ "${SALIDA}" = "0" ]

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backtest
          path: backtest.json
          if-no-files-found: ignore
