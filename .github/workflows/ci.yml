name: CI

# Pull requests, and every deploy before it builds (deploy.yml calls this).
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Lint and Test
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: alertas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d alertas" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --require-hashes -r requirements-servicio.txt -r requirements-dev.txt

      - name: Tests, with the database ones against the service container
        env:
          ALERTAS_TEST_DSN: postgresql://postgres:prueba@localhost:5432/alertas
        run: python -m pytest -q tests

      - name: Docker build
        run: docker build -t bicameral-alertas:test .
